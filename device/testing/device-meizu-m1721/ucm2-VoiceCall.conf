# Voice Call verb for Meizu m1721 (MSM8953 / apq8016_sbc / qdsp6 DPCM).
#
# CANDIDATE (authored 2026-07-07, not yet live-tested — see
# VOICECALL_BRINGUP.md for the verify procedure).
#
# Voice-call audio on msm8953-mainline goes through the out-of-tree q6voice
# stack (q6mvm/q6cvp/q6cvs + q6voice-dai), which the pmaports build base
# (msm8953-mainline tag v6.19.5-r0) carries and the pmOS config enables
# (CONFIG_SND_SOC_QDSP6_Q6VOICE=m, ..._Q6VOICE_DAI=m). The call vocoder runs
# inside the modem DSP; the AP only has to:
#   1. route the VoiceMMode1 DL/UL streams to the right MI2S back-ends
#      (the csets below — control names verified against q6voice-dai.c on
#      tag v6.19.5-r0), and
#   2. OPEN the VoiceMMode1 FE PCM for the duration of the call
#      (q6voice_dai_startup -> q6voice_start; done by the `q6voiced` daemon,
#      pmaports/modem/q6voiced, or by PipeWire when this profile's PCM is
#      streamed).
#
# The VoiceMMode1 FE is PCM device 4 (FACT, /proc/asound/pcm 00-04) and is
# held open by q6voiced (hw:0,4). The Playback/CapturePCM values below are
# deliberately the MultiMedia PCMs (hw:0,0 / hw:0,1), NOT hw:0,4: PulseAudio
# opens the profile's PCMs itself, and opening hw:0,4 collides with q6voiced
# (EBUSY) -> the whole card drops to Dummy Output mid-call (observed live
# 2026-07-08). The voice stream never passes through the AP; the csets route
# it between the modem and the MI2S back-ends inside the DSP.

SectionVerb {
	EnableSequence [
		# Voice downlink (modem -> WCD earpiece/headphones on PRIMARY MI2S)
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		# Voice uplink (WCD mics on TERTIARY MI2S TX -> modem)
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 1"
		# MultiMedia FE routing (same as HiFi): on qdsp6 a frontend PCM
		# (hw:0,0 / hw:0,1 used by this verb's devices) fails hw_params with
		# EINVAL unless it is routed to a back-end, and PulseAudio PROBES the
		# profile PCMs -- without these the whole Voice Call profile set is
		# dropped (observed live 2026-07-08).
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 1"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 0"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece voice call"

	Include.ees.File "/codecs/msm8953-wcd/EarpieceEnableSeq.conf"
	Include.eds.File "/codecs/msm8953-wcd/EarpieceDisableSeq.conf"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 300
		PlaybackChannels 1
	}
}

SectionDevice."Speaker" {
	Comment "Speakerphone (CS35L35 amp on QUATERNARY MI2S)"

	# Voice DL straight into the QUAT MI2S back-end that feeds the CS35L35
	# (same BE the HiFi Speaker device uses via
	# 'QUAT_MI2S_RX Audio Mixer MultiMedia1'). Control existence verified in
	# q6voice-dai.c (tag v6.19.5-r0): 'QUAT_MI2S_RX Voice Mixer' / kcontrol
	# 'VoiceMMode1'. Whether the amp DAPM powers up from a voice-only BE is
	# untested — see VOICECALL_BRINGUP.md fallback notes.
	EnableSequence [
		cset "name='QUAT_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='QUAT_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 200
		PlaybackChannels 1
	}
}

SectionDevice."Headphones" {
	Comment "Headphones voice call"

	Include.hpes.File "/codecs/msm8953-wcd/HeadphonesEnableSeq.conf"
	Include.hpds.File "/codecs/msm8953-wcd/HeadphonesDisableSeq.conf"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 400
		PlaybackChannels 1
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic1" {
	Comment "Primary (bottom) microphone"

	ConflictingDevice [
		"Headset"
		"Mic2"
	]

	Include.pmes.File "/codecs/msm8953-wcd/PrimaryMicEnableSeq.conf"
	Include.pmds.File "/codecs/msm8953-wcd/PrimaryMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 300
		CaptureMixerElem "TX1"
	}
}

SectionDevice."Mic2" {
	Comment "Secondary (top) microphone"

	ConflictingDevice [
		"Headset"
		"Mic1"
	]

	Include.smes.File "/codecs/msm8953-wcd/SecondaryMicEnableSeq.conf"
	Include.smds.File "/codecs/msm8953-wcd/SecondaryMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 200
		CaptureMixerElem "TX1"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	ConflictingDevice [
		"Mic1"
		"Mic2"
	]

	Include.hmes.File "/codecs/msm8953-wcd/HeadsetMicEnableSeq.conf"
	Include.hmds.File "/codecs/msm8953-wcd/HeadsetMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 400
		CaptureMixerElem "TX1"
		JackControl "Mic Jack"
	}
}
