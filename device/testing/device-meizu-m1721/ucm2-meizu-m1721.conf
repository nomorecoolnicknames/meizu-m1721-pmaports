Syntax 6

# UCM2 card matcher for the Meizu M6 Note (m1721 / MSM8953 / postmarketOS mainline).
#
# Card id (/proc/asound/card0/id): meizum1721
# Machine driver: sound/soc/qcom/apq8016_sbc.c, card compatible
#   "qcom,msm8953-qdsp6-sndcard" (q6afe / q6routing / q6asm DPCM).
#
# This directory name (conf.d/meizum1721) must equal the card driver/id so
# ucm.conf's conf.d lookup resolves to this file (same scheme as the sibling
# conf.d/motorola-potter and conf.d/xiaomi-mido in msm8953-mainline/alsa-ucm-conf).
#
# Adapted from msm8953-mainline/alsa-ucm-conf Motorola/potter (identical SoC,
# identical qdsp6 routing, identical on-SoC pm8953 / msm8953-wcd codec).
# The BootSequence below is potter's verbatim WCD gain init.

SectionUseCase."HiFi" {
	File "/Meizu/m1721/HiFi.conf"
	Comment "Play and record HiFi quality Music"
}

SectionUseCase."Voice Call" {
	File "/Meizu/m1721/VoiceCall.conf"
	Comment "Voice call (modem DSP vocoder via VoiceMMode1)"
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

BootSequence [
	cset "name='RX1 Digital Volume' 84"
	cset "name='RX2 Digital Volume' 84"
	cset "name='RX3 Digital Volume' 84"
	cset "name='ADC1 Volume' 6"
	cset "name='ADC2 Volume' 6"
	cset "name='ADC3 Volume' 6"
]
