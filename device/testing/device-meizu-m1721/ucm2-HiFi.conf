# HiFi verb for Meizu m1721 (MSM8953 / apq8016_sbc / qdsp6 DPCM).
#
# WCD outputs (Earpiece / Headphones) and the microphones use the on-SoC
# msm8953-wcd (pm8953) analog+digital codec on PRIMARY MI2S. These are wired
# exactly as the potter reference and reuse the on-device codec fragment
# /codecs/msm8953-wcd/* (shipped by msm8953-mainline/alsa-ucm-conf).
#
# Speaker is the external Cirrus CS35L35 boosted amp on the SECONDARY MI2S
# back-end. The only mixer needed to connect MultiMedia1 playback (hw:0,0) to
# the amp is 'SEC_MI2S_RX Audio Mixer MultiMedia1' (numid=162). Verified live:
# aplay -D hw:0,0 with this mixer on = audible speaker; the cs35l35 DAPM
# (SPK / Main AMP / AMP Playback) auto-powers with the stream.
# Source: SOUND_CS35L35_ROUTING.md sections 0, 1, r19.
#
# SEC vs QUAT: downstream DT calls this bus "quaternary", but MSM8953 mainline
# has no quat_mi2s TLMM function; the amp pads are the sec_mi2s group and the
# live q6routing control is SEC_MI2S_RX (not QUAT_MI2S_RX). If a device amixer
# dump ever shows the control is actually 'QUAT_MI2S_RX Audio Mixer MultiMedia1',
# edit the two cset lines in SectionDevice."Speaker" below -- that is the only
# change needed.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 1"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 1"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 0"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback (Cirrus CS35L35 amp on QUATERNARY MI2S)"

	ConflictingDevice [
		"Earpiece"
	]

	# r26: the amp DAI-link is QUATERNARY_MI2S_RX (SOUND_CS35L35_ROUTING.md
	# §r26 — moving off SECONDARY is what finally made it audible), so the
	# live q6routing control that reaches the CS35L35 is
	# 'QUAT_MI2S_RX Audio Mixer MultiMedia1' (verified: enabling it + aplay
	# hw:0,0 = audible speaker).
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	# PlaybackPriority history: 200 → 400 (2026-07-07, workaround while the
	# MBHC reported a permanent phantom 'Headphone Jack'=ON, so Speaker had to
	# outrank Headphones to be the default) → back to 200 (r27 DT fix
	# qcom,hphl/gnd-jack-type-normally-open landed; numid=54 now tracks the
	# real jack state, verified off-when-empty on-device). With an honest jack
	# the natural ranking (Headphones 300 > Speaker 200) gives correct
	# auto-switch: Speaker when unplugged, Headphones when plugged.
	# See SOUND_CS35L35_ROUTING.md §r27b/§r27c.
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 200
		PlaybackChannels 1
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	Include.ees.File "/codecs/msm8953-wcd/EarpieceEnableSeq.conf"
	Include.eds.File "/codecs/msm8953-wcd/EarpieceDisableSeq.conf"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
		PlaybackChannels 1
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	Include.hpes.File "/codecs/msm8953-wcd/HeadphonesEnableSeq.conf"
	Include.hpds.File "/codecs/msm8953-wcd/HeadphonesDisableSeq.conf"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 300
		PlaybackChannels 2
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic1" {
	Comment "Primary Microphone"

	ConflictingDevice [
		"Headset"
		"Mic2"
	]

	Include.pmes.File "/codecs/msm8953-wcd/PrimaryMicEnableSeq.conf"
	Include.pmds.File "/codecs/msm8953-wcd/PrimaryMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 300
		CaptureMixerElem "TX1"
	}
}

SectionDevice."Mic2" {
	Comment "Secondary Microphone"

	ConflictingDevice [
		"Headset"
		"Mic1"
	]

	Include.smes.File "/codecs/msm8953-wcd/SecondaryMicEnableSeq.conf"
	Include.smds.File "/codecs/msm8953-wcd/SecondaryMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 200
		CaptureMixerElem "TX1"
	}
}

# Voice-call note (2026-07-07): the verb-level csets above already pre-route
# VoiceMMode1 DL->PRI_MI2S_RX and TERT_MI2S_TX->UL (potter verbatim), so basic
# earpiece call audio can work even under HiFi once the VoiceMMode1 PCM is
# held open (q6voiced). The dedicated "Voice Call" verb lives in
# VoiceCall.conf (registered in meizum1721.conf) — see VOICECALL_BRINGUP.md.

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic1"
		"Mic2"
	]

	Include.hmes.File "/codecs/msm8953-wcd/HeadsetMicEnableSeq.conf"
	Include.hmds.File "/codecs/msm8953-wcd/HeadsetMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 400
		CaptureMixerElem "TX1"
		JackControl "Mic Jack"
	}
}
